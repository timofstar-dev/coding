<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사도행전 논술 활동지 생성기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container no-print">
        <h1>📖 사도행전 논술 활동지 생성기</h1>
        <p>선택한 진도와 학년군에 맞는 맞춤형 활동지를 생성합니다.</p>
        
        <form id="generatorForm">
            <div class="form-group">
                <label for="templateType">활동지 양식 선택</label>
                <select id="templateType" onchange="handleTemplateChange()" style="font-weight: bold; background-color: #eff6ff; border-color: #3b82f6;">
                    <option value="sein_essay" selected>🌟 [세인 5단계 심화 논술] 전체파악·절별요약·핵심찾기·맞춤법·6하원칙 (신규 PDF 양식)</option>
                    <option value="basic_grammar">📘 [기초 문법·띄어쓰기형] 헷갈리는 우리말·띄어쓰기·기초문법 (기존 양식)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="date">날짜</label>
                <input type="date" id="date" required>
            </div>
            
            <div class="form-group">
                <label for="grade">학년군</label>
                <select id="grade" required>
                    <option value="12">초등 1~2학년군</option>
                    <option value="34" selected>초등 3~4학년군</option>
                    <option value="56">초등 5~6학년군</option>
                </select>
            </div>

            <!-- 세인 심화 논술 전용 옵션 -->
            <div id="seinOptionsGroup">
                <div class="form-group" style="background-color: #f1f5f9; padding: 12px 14px; border-radius: 6px; border: 1px solid #cbd5e1;">
                    <label style="display: flex; align-items: center; gap: 8px; font-weight: bold; cursor: pointer; margin-bottom: 0;">
                        <input type="checkbox" id="includeSpelling" checked onchange="toggleSpellingOption(this.checked)" style="width: 18px; height: 18px; cursor: pointer;">
                        활동 4. 맞춤법 연습 활동 포함하기
                    </label>
                    <span style="font-size: 13px; color: #64748b; margin-top: 5px; display: block; margin-left: 26px;">
                        ※ 체크 해제 시 활동지에서 맞춤법 영역이 제외됩니다. (본문 중에 맞춤법 다룰 내용이 없을 때 해제)
                    </span>
                </div>
                <div class="form-group" id="spellingSetGroup" style="margin-top: 12px;">
                    <label for="spellingSetType">맞춤법 문제 세트 선택</label>
                    <select id="spellingSetType">
                        <option value="standard" selected>세인 표준 7문항 (며칠, 되/돼, 안/않, 않았다, 나았다, 어떡해, 띄어쓰기)</option>
                        <option value="random">다양한 맞춤법 랜덤 7문항 (맞춤법 풀 기반)</option>
                    </select>
                </div>
            </div>
            
            <!-- 기존 양식 전용 옵션 (기본 숨김) -->
            <div id="basicOptionsGroup" style="display: none;">
                <div class="form-group">
                    <label>1. 헷갈리는 우리말 선택 (3개 선택)</label>
                    <div id="confusingWordsCheckboxes" class="checkbox-group" style="max-height: 180px; overflow-y: auto; border: 1px solid #cbd5e1; padding: 10px; border-radius: 5px; background-color: #f8fafc;">
                        <!-- JS로 동적 생성 -->
                    </div>
                    <p id="checkbox-warning" style="color: #e63946; font-size: 14px; margin-top: 5px; display: none;">※ 정확히 3개를 선택해 주세요.</p>
                </div>

                <div class="form-group">
                    <label for="grammarType">3. 글쓰기 기초 유형 선택</label>
                    <select id="grammarType">
                        <!-- JS로 동적 생성 -->
                    </select>
                </div>
            </div>
            
            <div class="form-group">
                <label>진도 선택 (사도행전)</label>
                <div class="passage-select">
                    <select id="chapter" required>
                        <!-- 1장부터 28장까지 옵션 생성 (JS로 처리) -->
                    </select> 장
                    
                    <select id="startVerse" required>
                        <!-- 절 선택 옵션 (JS로 처리) -->
                    </select> 절 ~ 
                    
                    <select id="endVerse" required>
                        <!-- 절 선택 옵션 (JS로 처리) -->
                    </select> 절
                </div>
            </div>
            
            <button type="submit" class="btn" style="font-size: 19px; padding: 14px; font-weight: bold;">활동지 새롭게 생성하기</button>
        </form>

        <!-- 출제 기록 토글 버튼 -->
        <div style="margin-top: 25px; text-align: center;">
            <button type="button" class="btn" onclick="toggleHistory()" style="background-color: #64748b; font-size: 16px;">📂 출제 기록 검색 및 불러오기</button>
        </div>

        <!-- 출제 기록 영역 (기본 숨김) -->
        <div id="historySection" class="history-section no-print" style="display: none; margin-top: 15px; border: 1px solid #cbd5e1; padding: 20px; border-radius: 5px; background: #f8fafc;">
            <h3 style="margin-top:0;">📂 출제 기록 관리</h3>
            
            <!-- 검색 필터 -->
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <select id="filterGrade" onchange="renderHistory()" style="flex: 1; padding: 8px;">
                    <option value="all">모든 학년군</option>
                    <option value="12">초등 1~2학년군</option>
                    <option value="34">초등 3~4학년군</option>
                    <option value="56">초등 5~6학년군</option>
                </select>
                <select id="filterDate" onchange="renderHistory()" style="flex: 1; padding: 8px;">
                    <option value="all">모든 날짜</option>
                    <!-- JS로 동적 추가 -->
                </select>
            </div>

            <!-- 선택 도구 모음 -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 0 5px;">
                <label style="font-size: 14px; cursor: pointer; color: #475569;">
                    <input type="checkbox" id="selectAllHistory" onchange="toggleSelectAllHistory(this.checked)"> 전체 선택
                </label>
            </div>

            <ul id="historyList" style="list-style: none; padding: 0;"></ul>
            
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button type="button" class="btn" onclick="deleteSelectedHistory()" style="background-color: #f59e0b; font-size: 15px;">선택 기록 삭제</button>
                <button type="button" class="btn" onclick="clearHistory()" style="background-color: #94a3b8; font-size: 15px;">전체 기록 초기화</button>
            </div>
        </div>
    </div>

    <!-- 생성된 활동지가 표시될 영역 -->
    <div id="worksheetArea" class="worksheet-container" style="display: none;">
        <!-- 상단 빠른 인쇄 버튼 모음 -->
        <div class="no-print print-btn-container" style="margin-top: 0; margin-bottom: 25px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
            <button onclick="window.print()" class="btn" style="flex: 1; min-width: 180px;">🖨️ 학생용 활동지 인쇄</button>
            <button onclick="printAnswers()" class="btn" style="flex: 1; min-width: 180px; background-color: #dc2626;">✏️ 교사용 답안 인쇄</button>
            <button type="button" id="aiAnswerBtn" onclick="generateAIAnswers()" class="btn" style="flex: 1; min-width: 200px; background-color: #4f46e5;">✨ AI 정답 자동 생성</button>
        </div>

        <div id="worksheetContent">
            <!-- JS로 동적 렌더링 (세인 5단계 심화 논술 또는 기존 기초 문법형) -->
        </div>
        
        <!-- 하단 인쇄 버튼 모음 -->
        <div class="no-print print-btn-container" style="margin-top: 30px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
            <button onclick="window.print()" class="btn" style="flex: 1; min-width: 180px;">🖨️ 학생용 활동지 인쇄</button>
            <button onclick="printAnswers()" class="btn" style="flex: 1; min-width: 180px; background-color: #dc2626;">✏️ 교사용 답안 인쇄</button>
            <button type="button" id="aiAnswerBtnBottom" onclick="generateAIAnswers()" class="btn" style="flex: 1; min-width: 200px; background-color: #4f46e5;">✨ AI 정답 자동 생성</button>
        </div>
    </div>

    <script src="acts_data.js"></script>
    <script src="acts_data_rkv.js"></script>
    <script src="script.js"></script>
</body>
</html>
