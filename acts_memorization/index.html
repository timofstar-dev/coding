<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bible Verse Memorization App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-800">
    <div class="max-w-4xl mx-auto p-6">
        <header class="text-center py-8 mb-8 border-b border-gray-200">
            <h1 class="text-3xl font-bold text-indigo-700 mb-2">Bible Verse Memorization</h1>
            <p class="text-gray-600">Upload a PDF with Bible verses to practice memorizing with audio.</p>
        </header>

        <section class="bg-white p-6 rounded-lg shadow-md mb-8">
            <h2 class="text-xl font-semibold mb-4">1. Upload PDF</h2>
            <div class="flex flex-col sm:flex-row items-center gap-4">
                <input type="file" id="pdf-upload" accept="application/pdf" class="block w-full text-sm text-gray-500
                    file:mr-4 file:py-2 file:px-4
                    file:rounded-md file:border-0
                    file:text-sm file:font-semibold
                    file:bg-indigo-50 file:text-indigo-700
                    hover:file:bg-indigo-100
                " />
                <button id="process-btn" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-md font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                    Process PDF
                </button>
            </div>
            <p id="upload-status" class="mt-2 text-sm text-gray-500 hidden">Processing...</p>
        </section>

        <section class="bg-white p-6 rounded-lg shadow-md">
            <div class="flex justify-between items-center mb-4 border-b pb-4">
                <h2 class="text-xl font-semibold">2. Verses</h2>
            </div>
            
            <div id="global-toolbar" class="hidden flex flex-wrap items-center gap-4 mb-6 bg-gray-50 p-3 rounded-lg border border-gray-200">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="select-all" class="rounded text-indigo-600 focus:ring-indigo-500 w-4 h-4">
                    <span class="text-sm font-medium">Select All</span>
                </label>
                <div class="hidden sm:block h-6 w-px bg-gray-300"></div>
                <button id="play-selected-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-md text-sm font-medium transition flex items-center gap-2">
                    <i class="fa-solid fa-play"></i> Play Selected
                </button>
                <button id="stop-global-btn" class="bg-red-100 text-red-700 hover:bg-red-200 px-3 py-1.5 rounded-md text-sm font-medium transition flex items-center gap-2">
                    <i class="fa-solid fa-stop"></i> Stop
                </button>
                <div class="hidden sm:block h-6 w-px bg-gray-300"></div>
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="loop-selected" class="rounded text-indigo-600 focus:ring-indigo-500 w-4 h-4">
                    <span class="text-sm font-medium">Loop List</span>
                </label>
                
                <div class="ml-auto flex items-center gap-4">
                    <div class="flex items-center gap-2">
                        <label class="text-xs text-gray-500 font-medium">Voice:</label>
                        <select id="voice-select" class="border-gray-300 rounded-md shadow-sm text-sm p-1 focus:ring-indigo-500 focus:border-indigo-500 max-w-[140px] truncate">
                            <option value="">Loading...</option>
                        </select>
                    </div>
                    <div class="flex items-center gap-2">
                        <label class="text-xs text-gray-500 font-medium">Global Speed:</label>
                        <select id="global-speed" class="border-gray-300 rounded-md shadow-sm text-sm p-1 focus:ring-indigo-500 focus:border-indigo-500">
                            <option value="0.5">0.5x</option>
                            <option value="0.8">0.8x</option>
                            <option value="1" selected>1.0x</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="verses-container" class="space-y-6">
                <p class="text-gray-500 text-center py-8">Loading default verses...</p>
            </div>
        </section>
    </div>

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <!-- Main Script -->
    <script src="data.js"></script>
    <script src="script.js?v=2"></script>
</body>
</html>
